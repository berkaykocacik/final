<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final</title>
</head>
<body>
    <p><b>Kurul 1: </b><input type="number" value="0"></p>
    <p><b>Kurul 2: </b><input type="number" value="0"></p>
    <p><b>Kurul 3: </b><input type="number" value="0"></p>
    <p><b>Kurul 4: </b><input type="number" value="0"></p>
    <p><b>Kurul 5: </b><input type="number" value="0"></p>
    <button onclick="calc()">Hesapla</button>
    <p><b>Final: <span>0</span></b></p>
</body>
    <script>
        function calc(){
            let inps = document.querySelectorAll("input");
            let st = false;
            inps.forEach(el => {
                if(el.valueAsNumber > 100 || el.valueAsNumber < 0){
                    st = true;
                }
            });
            if(st){
                alert("girdiğiniz değerler 0-100 arası olmalı");
            }else{
                let fscore = ((59.5 - ((inps[0].valueAsNumber*0.14286+inps[1].valueAsNumber*0.22024+inps[2].valueAsNumber*0.25595+inps[3].valueAsNumber*0.2123+inps[4].valueAsNumber*0.16865)*0.6))/0.4);
                let sp = document.querySelector("span");
                if(fscore < 0){
                    alert("finale girmene gerek yok");
                    sp.innerHTML = "-";
                }else if(fscore > 100){
                    alert("100 alsan bile geçemezsin");
                    sp.innerHTML = "-";
                }else{
                    sp.innerHTML = fscore.toFixed(1);
                }
            }
        }
    </script>
</html>
